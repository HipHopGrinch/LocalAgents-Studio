name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Electron syntax check
        run: npm run check:electron

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Electron version
        run: node -e "console.log(require('electron/package.json').version)"

      - name: Electron advisory check
        continue-on-error: true
        run: node scripts/check-electron-advisories.cjs

      - name: Vite build
        run: npx vite build
